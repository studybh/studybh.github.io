<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudyBH – الصف الأول الثانوي</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#1cb0f6;--b2:#1186c4;--navy:#0f3557;--pale:#eaf6ff;--line:#cde5f6;--ok:#2f9e5b;--bad:#e5484d}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--navy);font:700 17px/1.6 Tajawal,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
.m{unicode-bidi:isolate;direction:ltr;display:inline-block;font:700 1.05em "Times New Roman",serif}
#top{position:sticky;top:0;z-index:5;background:var(--b1);color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px}
#top .logo{font-weight:800;font-size:1.35rem;margin-inline-end:auto;cursor:pointer}
.pill{background:#fff;color:var(--b2);border-radius:20px;padding:2px 12px;font-weight:800}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
.hero{background:var(--b1);color:#fff;border-radius:20px;padding:18px 20px;display:flex;gap:14px;align-items:center;border-bottom:6px solid var(--b2)}
.hero .face{font-size:3rem}.hero h2{margin:0;font-size:1.4rem}.hero p{margin:0;opacity:.95}
.goal{height:12px;background:#ffffff55;border-radius:8px;margin-top:8px;overflow:hidden}.goal i{display:block;height:100%;background:#fff;border-radius:8px}
h3{margin:26px 0 12px;font-size:1.25rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:#fff;border:2px solid var(--line);border-bottom:5px solid var(--line);border-radius:18px;padding:14px 8px;text-align:center;position:relative}
.card .e{font-size:2.2rem}.card b{display:block}.card small{display:block;opacity:.75;min-height:1.6em}
.card.on{background:var(--b1);color:#fff;border-color:var(--b2);border-bottom-color:var(--b2)}
.card.on small{opacity:1}
.tag{position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:.75rem;border-radius:10px;padding:0 10px}
.card:not(.on){background:var(--pale)}
.btn{display:block;width:100%;background:var(--b1);color:#fff;border:0;border-bottom:5px solid var(--b2);border-radius:16px;padding:12px;font-size:1.1rem;font-weight:800}
.btn:active{transform:translateY(3px);border-bottom-width:2px}
.btn.off{background:#dfe9f2;color:#8aa0b4;border-bottom-color:#c4d3e0;pointer-events:none}
.back{background:none;border:0;color:var(--b2);font-weight:800;padding:0;margin-bottom:10px}
.unit{background:var(--b1);color:#fff;border-radius:18px;padding:14px 18px;border-bottom:5px solid var(--b2)}
.unit small{opacity:.95;display:block}.unit.soon{background:#9ab8cf;border-bottom-color:#7f9fb8}
.path{display:flex;flex-direction:column;align-items:center;gap:18px;padding:22px 0}
.node{width:78px;height:78px;border-radius:50%;border:0;border-bottom:7px solid var(--b2);background:var(--b1);color:#fff;font-size:2rem;position:relative}
.node:active{transform:translateY(4px);border-bottom-width:3px}
.node.done{background:#fff;color:var(--b2);box-shadow:inset 0 0 0 5px var(--b1);border-bottom-color:var(--line)}
.node.lock{background:#dfe9f2;color:#8aa0b4;border-bottom-color:#c4d3e0;cursor:default}
.node .lbl{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:.8rem;color:var(--navy);white-space:nowrap;margin-top:6px}
.node.go::before{content:"ابدأ";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:#fff;color:var(--b2);border:2px solid var(--line);border-radius:12px;padding:0 12px;font-size:.9rem;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translate(-50%,-6px)}}
@media(prefers-reduced-motion:reduce){.node.go::before{animation:none}}
.lesson{position:fixed;inset:0;background:#fff;z-index:10;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;font-size:1.5rem;color:#8aa0b4}
.prog{flex:1;height:16px;background:var(--pale);border-radius:10px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--b1);border-radius:10px;transition:width .3s}
.body{flex:1;overflow:auto;max-width:640px;width:100%;margin:0 auto;padding:6px 18px 20px}
.body h2{font-size:1.6rem;margin:6px 0 12px}
.box{background:var(--pale);border:2px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0}
.row{display:flex;align-items:center;gap:12px;margin:10px 0}
.chip{min-width:46px;height:46px;border-radius:14px;background:var(--b1);color:#fff;display:grid;place-items:center;font-size:1.3rem;border-bottom:4px solid var(--b2)}
table{width:100%;border-collapse:collapse;text-align:center;margin-top:8px}
th{background:var(--b1);color:#fff;padding:6px}td{border:2px solid var(--line);padding:6px}
.foot{border-top:2px solid var(--line);padding:14px 16px}.foot .in{max-width:640px;margin:auto}
.foot.good{background:#dff5e6;color:var(--ok)}.foot.bad{background:#fde4e5;color:var(--bad)}
.foot .msg{font-weight:800;font-size:1.15rem;margin-bottom:10px}
.opt{display:block;width:100%;text-align:start;background:#fff;border:2px solid var(--line);border-bottom:5px solid var(--line);border-radius:16px;padding:12px 16px;margin:10px 0;font-size:1.1rem}
.opt.sel{border-color:var(--b1);background:var(--pale);color:var(--b2)}
.opt.right{border-color:var(--ok);background:#dff5e6;color:var(--ok)}.opt.wrong{border-color:var(--bad);background:#fde4e5;color:var(--bad)}
.center{text-align:center;padding-top:30px}.center .big{font-size:5rem}
.stats{display:flex;gap:10px;justify-content:center;margin:16px 0}.stats div{border:2px solid var(--b1);border-radius:14px;padding:6px 14px;min-width:90px;color:var(--b2)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:8px 20px;border-radius:20px;z-index:20;display:none}
</style>
</head>
<body>
<div id="top"><span class="logo" onclick="home()">StudyBH 🐬</span><span class="pill" id="st"></span><span class="pill" id="xp"></span></div>
<main id="app"></main>
<div id="toast"></div>
<script>
const M=s=>'<span class="m">'+s+'</span>';
let S={streak:0,last:'',xp:0,exp:false,quiz:false,today:0,todayDate:''};
try{S=Object.assign(S,JSON.parse(localStorage.getItem('studybh')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('studybh',JSON.stringify(S))}catch(e){}};
const ds=d=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
const T=()=>ds(new Date()),Y=()=>{const d=new Date();d.setDate(d.getDate()-1);return ds(d)};
function streakNow(){return(S.last===T()||S.last===Y())?S.streak:0}
function gain(x){const t=T();if(S.last!==t){S.streak=(S.last===Y())?S.streak+1:1;S.last=t}
 if(S.todayDate!==t){S.todayDate=t;S.today=0}S.today+=x;S.xp+=x;save();head()}
function head(){st.textContent='🔥 '+streakNow();xp.textContent='⭐ '+S.xp}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1600)}

const SUBJ=[['ريض 151','الرياضيات','➗',1],['عرب 101','اللغة العربية','📚'],['انج 101','اللغة الإنجليزية','🔤'],['فيز 102','الفيزياء','⚛️'],['كيم 102','الكيمياء','🧪'],['حيا 102','الأحياء','🧬'],['اجا 102','','🌍'],['قصد 101','','💰'],['اسر 102','','🏠'],['بدن 101','التربية البدنية','⚽'],['تقن 107','التقنية','💻'],['دين 101','التربية الإسلامية','🕌'],['وطن 101','التربية الوطنية','🇧🇭']];

function home(){
 const g=Math.min(100,(S.todayDate===T()?S.today:0)*2);
 app.innerHTML=`<div class="hero"><div class="face">🐬</div><div style="flex:1"><h2>أهلًا بك في الصف الأول الثانوي</h2><p>أكمل درسًا اليوم وحافظ على سلسلتك 🔥</p><div class="goal"><i style="width:${g}%"></i></div></div></div>
 <h3>موادك</h3><div class="grid">${SUBJ.map((s,i)=>`<button class="card ${s[3]?'on':''}" onclick="pick(${i})">${s[3]?'':'<span class="tag">قريبًا</span>'}<span class="e">${s[2]}</span><b>${s[0]}</b><small>${s[1]}</small></button>`).join('')}</div>`;
 scrollTo(0,0)}
function pick(i){SUBJ[i][3]?path():toast('قريبًا ✨ نجهّز لك هذه المادة')}

function path(){
 const n=(c,ic,l,fn,off)=>`<button class="node ${c}" style="transform:translateX(${off}px)" onclick="${fn}">${ic}<span class="lbl">${l}</span></button>`;
 const e=S.exp,q=S.quiz;
 app.innerHTML=`<button class="back" onclick="home()">› رجوع</button>
 <div class="unit"><small>ريض 151 – الرياضيات 1</small><b>الدرس ١: المجموعات والفترات</b></div>
 <div class="path">
  ${n(e?'done':'go',e?'✓':'📖','شرح','explain()',0)}
  ${n(q?'done':(e?'go':'lock'),q?'✓':(e?'🎯':'🔒'),'أسئلة',e?'quiz()':"toast('أكمل الشرح أولًا 📖')",-55)}
 </div>
 <div class="unit soon"><small>قريبًا</small><b>الدرس ٢</b></div>
 <div class="path">${n('lock','🔒','قريبًا',"toast('قريبًا ✨')",40)}</div>
 <div class="unit soon"><small>قريبًا</small><b>الدرس ٣</b></div>
 <div class="path">${n('lock','🔒','قريبًا',"toast('قريبًا ✨')",-40)}</div>`;
 scrollTo(0,0)}

/* ===== الشرح ===== */
const row=(c,t)=>`<div class="row"><div class="chip">${c}</div><div>${t}</div></div>`;
const CARDS=[
['أهداف الدرس 🎯',`<div class="box">تصنيف الأعداد الحقيقية.</div><div class="box">وصف مجموعات جزئية من مجموعة الأعداد الحقيقية.</div>`],
['لماذا؟ 🏎️',`<p>في سباق للسيارات يجب ألا يقل عمر المتسابق عن 25 سنة.</p><div class="box">يمكن التعبير عن ذلك بالمتباينة ${M('x ≥ 25')}</div><div class="box">ويمكن أيضًا التعبير عنه بصورة فترة: ${M('[25, ∞)')}</div>`],
['مجموعات الأعداد',row('N','الأعداد الطبيعية: '+M('{1, 2, 3, …}'))+row('W','الأعداد الكلية: '+M('{0, 1, 2, 3, …}'))+row('Z','الأعداد الصحيحة: '+M('{…, −3, −2, −1, 0, 1, 2, 3, …}'))],
['الأعداد النسبية Q',`<p>هي الأعداد التي يمكن كتابتها على الصورة ${M('a/b')} حيث a وَ b عددان صحيحان و b لا يساوي صفرًا.</p><div class="box">صورتها العشرية إما منتهية أو دورية.</div><div class="box">أمثلة: ${M('0.125')} ، ${M('−7/8')} ، ${M('2/3 = 0.66…')}</div>`],
['الأعداد غير النسبية I',`<p>صورتها العشرية ليست منتهية وليست دورية.</p><div class="box">أمثلة: ${M('π = 3.14159…')} ، ${M('√3 = 1.73205…')}</div><div class="box">الجذور التربيعية للأعداد الكلية التي ليست مربعات كاملة هي أعداد غير نسبية.</div>`],
['الأعداد الحقيقية R',`<p>تتكون من مجموعتين مختلفتين: النسبية وغير النسبية.</p><div class="box">كل من N وَ W وَ Z مجموعة جزئية من Q، لأن كل عدد صحيح n يمكن كتابته ${M('n/1')}</div><div class="box" style="text-align:center">${M('N ⊂ W ⊂ Z ⊂ Q ⊂ R')}</div>`],
['مثال: تصنيف الأعداد',`<p>سمِّ مجموعات الأعداد التي ينتمي إليها كل عدد:</p>`+row(M('−23'),'Z ، Q ، R')+row(M('√50'),'I ، R')+row(M('−4/9'),'Q ، R')],
['رموز الفترات',`<div class="box">الرمزان ${M('[ ]')} : طرف الفترة <b>ينتمي</b> إليها.</div><div class="box">الرمزان ${M('( )')} : طرف الفترة <b>لا ينتمي</b> إليها.</div><div class="box">الرمزان ${M('∞')} و ${M('−∞')} : الفترة غير محدودة.</div>
<table><tr><th>المتباينة</th><th>الفترة</th></tr><tr><td>${M('a ≤ x ≤ b')}</td><td>${M('[a, b]')}</td></tr><tr><td>${M('a < x < b')}</td><td>${M('(a, b)')}</td></tr><tr><td>${M('a ≤ x < b')}</td><td>${M('[a, b)')}</td></tr><tr><td>${M('a < x ≤ b')}</td><td>${M('(a, b]')}</td></tr><tr><td>${M('x ≥ a')}</td><td>${M('[a, ∞)')}</td></tr><tr><td>${M('x < a')}</td><td>${M('(−∞, a)')}</td></tr></table>`]
];
let ci=0;
function layer(h){let l=document.getElementById('L');if(!l){l=document.createElement('div');l.id='L';l.className='lesson';document.body.appendChild(l)}l.innerHTML=h}
function close_(){const l=document.getElementById('L');if(l)l.remove();path()}
function explain(){ci=0;card()}
function card(){const c=CARDS[ci],last=ci===CARDS.length-1;
 layer(`<div class="bar"><button class="x" onclick="close_()">✕</button><div class="prog"><i style="width:${ci/CARDS.length*100}%"></i></div></div>
 <div class="body"><h2>${c[0]}</h2>${c[1]}</div>
 <div class="foot"><div class="in"><button class="btn" onclick="${last?'doneExp()':'ci++;card()'}">${last?'أنهيت الشرح 🎉':'التالي'}</button></div></div>`);
 setTimeout(()=>{const i=document.querySelector('#L .prog i');if(i)i.style.width=((ci+1)/CARDS.length*100)+'%'},30)}
function doneExp(){const f=!S.exp;S.exp=true;gain(f?10:0);if(f)toast('+10 ⭐');close_()}

/* ===== الأسئلة ===== */
const Q=[
['العدد '+M('−23')+' ينتمي إلى مجموعة الأعداد:',['الطبيعية N','الصحيحة Z','غير النسبية I','الكلية W'],1,'−23 عدد صحيح سالب، فهو في Z وQ وR.'],
['العدد '+M('√50')+' ينتمي إلى مجموعة الأعداد:',['الصحيحة Z','النسبية Q','غير النسبية I','الكلية W'],2,'50 ليس مربعًا كاملًا، فجذره عدد غير نسبي.'],
['العدد '+M('−4/9')+' ينتمي إلى مجموعة الأعداد:',['الطبيعية N','الكلية W','الصحيحة Z','النسبية Q'],3,'يمكن كتابته على الصورة a/b، فهو عدد نسبي.'],
['أي الأعداد التالية عدد غير نسبي؟',[M('0.125'),M('2/3'),M('π'),M('−5')],2,'π صورته العشرية غير منتهية وغير دورية.'],
['العدد '+M('√36')+' ينتمي إلى مجموعة الأعداد:',['غير النسبية I فقط','الكلية W','ليس عددًا حقيقيًا','ليس نسبيًا'],1,'√36 = 6 وهو عدد كلي.'],
['المتباينة '+M('x ≥ 25')+' تكتب بصورة فترة هكذا:',[M('(25, ∞)'),M('[25, ∞)'),M('(−∞, 25]'),M('(−∞, 25)')],1,'25 تنتمي للفترة فنستخدم [ ، والفترة غير محدودة من اليمين.'],
['الفترة '+M('(−3, 5]')+' تعني:',[M('−3 ≤ x ≤ 5'),M('−3 < x < 5'),M('−3 < x ≤ 5'),M('−3 ≤ x < 5')],2,'القوس ( لا يضم −3 والقوس ] يضم 5.'],
['الرمزان '+M('( )')+' يدلان على:',['انتماء طرف الفترة إليها','عدم انتماء طرف الفترة إليها','أن الفترة مغلقة','أن العدد صحيح'],1,'القوسان ( ) يعنيان أن الطرف لا ينتمي إلى الفترة.']
];
let q;
const shuf=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(v=>v[1]);
function quiz(){q={i:0,h:5,ok:0,sel:-1,chk:false,ord:shuf(Q.map((_,i)=>i))};qs()}
function qs(){const it=Q[q.ord[q.i]],opts=it[1].map((t,i)=>i);q.o=shuf(opts);q.sel=-1;q.chk=false;qr()}
function qr(){const it=Q[q.ord[q.i]];
 const o=q.o.map(i=>{let c='opt';if(q.chk){if(i===it[2])c+=' right';else if(i===q.sel)c+=' wrong'}else if(i===q.sel)c+=' sel';
  return `<button class="${c}" onclick="pickO(${i})">${it[1][i]}</button>`}).join('');
 const ok=q.sel===it[2];
 const foot=q.chk?`<div class="foot ${ok?'good':'bad'}"><div class="in"><div class="msg">${ok?'ممتاز! 🎉':'ليس صحيحًا 😅'}</div><div style="margin-bottom:10px;font-weight:500">${it[3]}</div><button class="btn" style="${ok?'':'background:var(--bad);border-bottom-color:#b3363a'}" onclick="nextQ()">متابعة</button></div></div>`
  :`<div class="foot"><div class="in"><button class="btn ${q.sel<0?'off':''}" onclick="checkQ()">تحقق</button></div></div>`;
 layer(`<div class="bar"><button class="x" onclick="close_()">✕</button><div class="prog"><i style="width:${q.i/Q.length*100}%"></i></div><b style="color:var(--bad)">❤️ ${q.h}</b></div>
 <div class="body"><h2>${it[0]}</h2>${o}</div>${foot}`)}
function pickO(i){if(q.chk)return;q.sel=i;qr()}
function checkQ(){if(q.sel<0)return;q.chk=true;if(q.sel===Q[q.ord[q.i]][2])q.ok++;else q.h--;qr()}
function nextQ(){if(q.h<=0)return end(false);q.i++;q.i>=Q.length?end(true):qs()}
function end(win){
 if(win){const f=!S.quiz;S.quiz=true;gain(q.ok*5);}
 layer(`<div class="body center"><div class="big">${win?'🏆':'💔'}</div><h2>${win?'أحسنت! أنهيت الدرس':'انتهت القلوب'}</h2>
 <p>${win?'أجبت إجابات صحيحة: '+q.ok+' من '+Q.length:'لا بأس، راجع الشرح وحاول مرة أخرى.'}</p>
 ${win?`<div class="stats"><div>⭐ +${q.ok*5}<br>نقاط</div><div>🔥 ${streakNow()}<br>سلسلة</div></div>`:''}</div>
 <div class="foot"><div class="in"><button class="btn" onclick="${win?'close_()':'quiz()'}">${win?'متابعة':'حاول مرة أخرى'}</button></div></div>`)}

head();home();
</script>
</body>
</html>
